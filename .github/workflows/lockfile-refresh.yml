name: Lockfile refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argrounds-website/argrounds-final
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: argrounds-website/argrounds-final/package-lock.json

      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: argrounds-website/argrounds-final/package-lock.json
          if-no-files-found: error
